<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Система учёта</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: #e8edf3; padding: 15px; max-width: 480px; margin: 0 auto; min-height: 100vh; }
  .container { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
  .header { text-align: center; margin-bottom: 20px; }
  .header h1 { font-size: 26px; color: #1a1a2e; letter-spacing: -0.5px; }
  .header p { color: #888; font-size: 14px; margin-top: 4px; }
  .card { background: #f8f9fc; border-radius: 14px; padding: 16px; margin: 12px 0; }
  .card-title { font-size: 13px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
  .btn { display: block; width: 100%; padding: 15px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; margin: 6px 0; text-align: center; text-decoration: none; }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-green { background: #34C759; color: white; }
  .btn-blue { background: #007AFF; color: white; }
  .btn-red { background: #FF3B30; color: white; }
  .btn-outline { background: transparent; color: #007AFF; border: 2px solid #007AFF; }
  .btn-purple { background: #AF52DE; color: white; }
  .input-group { display: flex; gap: 10px; margin: 8px 0; flex-wrap: wrap; }
  .input-group select, .input-group input { flex: 1; min-width: 100px; padding: 12px 14px; border: 2px solid #e5e5ea; border-radius: 10px; font-size: 15px; background: white; }
  .info-row { display: flex; justify-content: space-between; padding: 10px 14px; background: white; border-radius: 10px; margin: 8px 0; border: 1px solid #e5e5ea; }
  .info-row .label { color: #888; font-size: 14px; }
  .info-row .value { font-weight: 700; font-size: 18px; color: #1a1a2e; }
  #status { padding: 12px 16px; border-radius: 10px; margin: 10px 0; display: none; font-size: 14px; }
  .status-success { background: #d4edda; color: #155724; display: block; }
  .status-error { background: #f8d7da; color: #721c24; display: block; }
  .status-info { background: #d1ecf1; color: #0c5460; display: block; }
  .hidden { display: none !important; }
  .screen { display: none; }
  .screen.active { display: block; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; background: #1a1a2e; color: white; padding: 10px 14px; border-radius: 12px; margin-bottom: 12px; font-size: 13px; }
  .top-bar button { background: rgba(255,255,255,0.2); color: white; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; }
  
  .scanner-box { background: #1a1a2e; border-radius: 14px; padding: 20px; text-align: center; color: white; min-height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .scanner-box .icon { font-size: 48px; margin-bottom: 10px; }
  #camera-container { position: relative; width: 100%; background: #000; border-radius: 12px; overflow: hidden; display: none; margin-top: 10px; }
  #camera-container video { width: 100%; display: block; max-height: 300px; object-fit: cover; }
  #camera-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; text-align: center; pointer-events: none; }
  #camera-overlay .scan-frame { width: 180px; height: 180px; border: 2px solid rgba(255,255,255,0.5); border-radius: 12px; margin: 0 auto; position: relative; }
  .scan-line { position: absolute; top: 50%; left: 10%; width: 80%; height: 2px; background: #4CAF50; animation: scanLine 2s ease-in-out infinite; }
  @keyframes scanLine { 0% { top: 10%; } 50% { top: 90%; } 100% { top: 10%; } }
  .result-box { margin: 12px 0; padding: 14px; background: #f8f9fc; border-radius: 12px; border-left: 4px solid #34C759; display: none; }
  .result-box input { width: 100%; padding: 10px; border: 1px solid #e5e5ea; border-radius: 8px; font-size: 14px; background: white; margin: 4px 0; }
</style>
</head>
<body>

<div id="screen-select" class="screen active">
  <div class="container">
    <div class="header">
      <h1 id="appNameTitle">📦 Система учёта</h1>
      <p>Выберите смену и участок для начала</p>
    </div>
    <div class="card">
      <div class="card-title" style="margin-bottom:8px;">👥 Смена</div>
      <select id="shiftSelect" style="width:100%; padding:12px; border:2px solid #e5e5ea; border-radius:10px; font-size:16px; -webkit-appearance:none; appearance:none; background:#fff url('data:image/svg+xml;utf8,<svg fill=\"%23888\" height=\"24\" viewBox=\"0 0 24 24\" width=\"24\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M7 10l5 5 5-5z\"/><path d=\"M0 0h24v24H0z\" fill=\"none\"/></svg>') no-repeat right 10px center; background-size: 24px;"></select>
    </div>
    <div class="card">
      <div class="card-title" style="margin-bottom:8px;">🏭 Участок</div>
      <select id="sectionSelect" style="width:100%; padding:12px; border:2px solid #e5e5ea; border-radius:10px; font-size:16px; -webkit-appearance:none; appearance:none; background:#fff url('data:image/svg+xml;utf8,<svg fill=\"%23888\" height=\"24\" viewBox=\"0 0 24 24\" width=\"24\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M7 10l5 5 5-5z\"/><path d=\"M0 0h24v24H0z\" fill=\"none\"/></svg>') no-repeat right 10px center; background-size: 24px;"></select>
    </div>
    <button class="btn btn-green" id="startWorkBtn" onclick="startWork()" disabled style="margin-top: 20px;">▶ Начать работу</button>
    <div id="selectStatus" style="margin-top:10px;font-size:13px; text-align:center;"></div>
  </div>
</div>

<div id="screen-work" class="screen">
  <div class="container">
    <div class="top-bar">
      <span>🏭 <b id="currentSection">-</b> · Смена <b id="currentShift">-</b></span>
      <button onclick="changeWork()">✏️ Изменить</button>
    </div>
    <div id="status"></div>
    
    <div class="card" id="scannerCard">
      <div class="card-title">📷 Сканер QR-кода</div>
      <div class="scanner-box" id="scannerBox">
        <span class="icon">📷</span>
        <p style="font-size:14px; opacity:0.8; margin-bottom:10px;">Наведите камеру на QR-код</p>
        <button class="btn btn-blue" id="scanBtn" onclick="startCamera()">▶ Запустить сканер</button>
        <button class="btn btn-red hidden" id="stopBtn" onclick="stopCamera()">⏹ Остановить</button>
      </div>
      <div id="camera-container">
        <video id="video" autoplay playsinline muted></video>
        <div id="camera-overlay"><div class="scan-frame"><div class="scan-line"></div></div></div>
      </div>
      <div class="result-box" id="resultBox">
        <label style="font-size:12px; color:#888; display:block; margin-bottom:4px;">📋 Данные QR-кода:</label>
        <input type="text" id="qrResult" readonly>
        <button class="btn btn-green" onclick="confirmQrShipment()">✅ Подтвердить отгрузку</button>
      </div>
    </div>
    
    <div class="card" id="manualCard">
      <div class="card-title">✏️ Ручной ввод</div>
      <div style="font-size:13px;color:#888;margin-bottom:6px;">Выбор из списка</div>
      <div class="input-group">
        <select id="partSelect" onchange="onPartSelect()"><option value="">⏳ Загрузка...</option></select>
        <input type="number" id="qtyInput" placeholder="Кол-во" min="1" style="max-width:90px;" oninput="validateQty()">
      </div>
      <div class="info-row">
        <span class="label">📊 Доступно:</span>
        <span class="value" id="availableDisplay">-</span>
      </div>
      <button class="btn btn-blue" id="btnShip" onclick="manualOperation('ship')" disabled>📦 Отгрузить</button>
      <button class="btn btn-green" id="btnReceive" style="background:#28a745;margin-top:8px;" onclick="manualOperation('receive')" disabled>📥 Принять</button>
      <button class="btn btn-red" id="btnWriteOff" style="background:#dc3545;margin-top:8px;" onclick="manualOperation('writeOff')" disabled>🗑️ Списать</button>
    </div>
    
    <div class="card">
      <div class="card-title">📄 Отчетность</div>
      <div style="margin-bottom: 10px;">
        <label style="font-size:13px; color:#888; display:block; margin-bottom:4px;">Дата отчета (день начала смены):</label>
        <input type="date" id="reportDate" style="width:100%; padding:12px; border:2px solid #e5e5ea; border-radius:10px; font-size:15px;">
      </div>
      <button class="btn btn-purple" id="reportBtn" onclick="generateReport()">📊 Сформировать PDF-отчет</button>
      
      <!-- Кнопка "Посмотреть все действия" (открывает текущую таблицу) -->
      <button class="btn btn-outline" onclick="openSpreadsheet()" style="margin-top: 8px; border-color: #888; color: #888;">👁️ Посмотреть все действия</button>
    </div>
    
    <button class="btn btn-outline" onclick="loadParts()" style="margin-top:10px;">🔄 Обновить список</button>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzQ2jsXV6fumO4R_tRrh9wevCqswPFhOLJXqF1fQI96uD4LOjTfWYatSF0wkCBCIRpo/exec'; // ВСТАВЬТЕ СЮДА ВАШ URL!

let APP_SETTINGS = null;
let ALL_PARTS = [];
let CURRENT_PARTS = [];
let CURRENT_SECTION = null;
let CURRENT_SHIFT = null;
let autoRefreshTimer = null;
let videoStream = null;
let scanInterval = null;
let scannedData = null;

function jsonp(action) {
  return new Promise((resolve, reject) => {
    const cb = 'jsonpCb_' + Math.round(1e9 * Math.random());
    const script = document.createElement('script');
    script.src = API_URL + '?action=' + encodeURIComponent(action) + '&callback=' + cb;
    window[cb] = function (res) {
      if (res.success) resolve(res.data);
      else reject(new Error(res.error));
      document.body.removeChild(script); delete window[cb];
    };
    script.onerror = function () { document.body.removeChild(script); delete window[cb]; reject(new Error('Ошибка сети')); };
    document.body.appendChild(script);
  });
}

async function bootstrap() {
  try {
    document.getElementById('selectStatus').innerHTML = '⏳ Загрузка данных...';
    const data = await jsonp('bootstrap');
    APP_SETTINGS = data.settings;
    ALL_PARTS = data.parts || [];
    applySettings();
    renderSelectScreen();
    document.getElementById('selectStatus').innerHTML = '';
    
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    document.getElementById('reportDate').value = `${yyyy}-${mm}-${dd}`;
    
  } catch (err) {
    document.getElementById('selectStatus').innerHTML = '<span style="color:red">❌ ' + err.message + '</span>';
  }
}

// Динамическое открытие текущей таблицы (не зависит от вбитого ID)
function openSpreadsheet() {
  // Если приложение открыто из Apps Script, берем ID из URL
  if (window.location.href.includes('script.google.com')) {
    // В этом случае у нас нет прямого доступа к таблице, открываем надежный URL
    // Но скорее всего вы открываете приложение с GitHub, тогда таблицу мы не знаем.
    // Поэтому просто выводим инструкцию.
    alert("Пожалуйста, откройте вашу Google Таблицу вручную и перейдите на лист 'Все действия'.");
  } else {
    // Если это GitHub Pages, у нас нет доступа к таблице. 
    // Выводим подсказку.
    alert("Откройте вашу Google Таблицу и перейдите на лист 'Все действия', чтобы проверить записи.");
  }
}

function applySettings() {
  const s = APP_SETTINGS;
  document.title = s.appName;
  document.getElementById('appNameTitle').textContent = '📦 ' + s.appName;
  
  document.getElementById('scannerCard').style.display = s.scannerEnabled ? 'block' : 'none';
  document.getElementById('manualCard').style.display = s.manualInputEnabled ? 'block' : 'none';
  document.getElementById('btnShip').style.display = s.shipEnabled ? 'block' : 'none';
  document.getElementById('btnReceive').style.display = s.receiveEnabled ? 'block' : 'none';
  document.getElementById('btnWriteOff').style.display = s.writeOffEnabled ? 'block' : 'none';
}

function renderSelectScreen() {
  const shiftSel = document.getElementById('shiftSelect');
  const secSel = document.getElementById('sectionSelect');
  
  shiftSel.innerHTML = '<option value="">Выберите смену...</option>';
  secSel.innerHTML = '<option value="">Выберите участок...</option>';

  APP_SETTINGS.shifts.forEach(sh => {
    const o = document.createElement('option'); o.value = sh; o.textContent = 'Смена ' + sh; shiftSel.appendChild(o);
  });
  
  APP_SETTINGS.sections.forEach(sec => {
    const o = document.createElement('option'); 
    o.value = sec; 
    o.textContent = sec; 
    secSel.appendChild(o);
  });

  const check = () => {
    CURRENT_SHIFT = shiftSel.value;
    CURRENT_SECTION = secSel.value;
    document.getElementById('startWorkBtn').disabled = !(CURRENT_SHIFT && CURRENT_SECTION);
  };
  shiftSel.onchange = check;
  secSel.onchange = check;
}

function startWork() {
  if (!CURRENT_SHIFT || !CURRENT_SECTION) return;
  document.getElementById('screen-select').classList.remove('active');
  document.getElementById('screen-work').classList.add('active');
  
  document.getElementById('currentSection').textContent = CURRENT_SECTION;
  document.getElementById('currentShift').textContent = CURRENT_SHIFT;
  
  document.getElementById('qtyInput').value = ''; 
  validateQty();
  loadParts();
  
  if (autoRefreshTimer) clearInterval(autoRefreshTimer);
  autoRefreshTimer = setInterval(() => { loadParts(true); }, 180000); 
}

function changeWork() {
  document.getElementById('screen-work').classList.remove('active');
  document.getElementById('screen-select').classList.add('active');
  if (autoRefreshTimer) clearInterval(autoRefreshTimer);
  stopCamera();
}

async function loadParts(silent = false) {
  const select = document.getElementById('partSelect');
  const currentValue = select.value;
  
  if (!silent) {
    select.innerHTML = '<option value="">⏳ Загрузка...</option>';
    showStatus('info', '🔄 Загрузка...');
  }
  
  try {
    ALL_PARTS = await jsonp('getParts');
    updateSelect(currentValue);
    if (!silent) showStatus('success', '✅ Данные обновлены');
  } catch (err) {
    if (!silent) showStatus('error', '❌ Ошибка обновления: ' + err.message);
  }
}

function updateSelect(keepValue) {
  const select = document.getElementById('partSelect');
  select.innerHTML = '';
  
  CURRENT_PARTS = ALL_PARTS.filter(p => p.stocks && p.stocks[CURRENT_SECTION] !== undefined);

  if (!CURRENT_PARTS.length) { 
    select.innerHTML = '<option value="">❌ Нет деталей для этого участка</option>'; 
    return; 
  }
  
  const opt = document.createElement('option'); opt.value = ''; opt.textContent = 'Выберите парт-номер...';
  select.appendChild(opt);
  
  CURRENT_PARTS.forEach(p => {
    const o = document.createElement('option');
    o.value = p.partNumber;
    const qty = p.stocks[CURRENT_SECTION] || 0; 
    const nameStr = p.name ? ` (${p.name})` : '';
    o.textContent = `${p.partNumber}${nameStr} — ${qty} шт.`;
    select.appendChild(o);
  });

  if (keepValue && CURRENT_PARTS.some(p => p.partNumber === keepValue)) select.value = keepValue;
  onPartSelect();
}

function onPartSelect() {
  const sel = document.getElementById('partSelect').value;
  const display = document.getElementById('availableDisplay');
  if (!sel) { display.textContent = '-'; } 
  else {
    const p = CURRENT_PARTS.find(x => x.partNumber === sel);
    display.textContent = p ? (p.stocks[CURRENT_SECTION] || 0) : '?';
  }
  validateQty();
}

function validateQty() {
  const qtyInput = document.getElementById('qtyInput');
  const partSelect = document.getElementById('partSelect');
  const qty = parseInt(qtyInput.value);
  const part = partSelect.value;
  const isValid = (qty > 0 && part !== '');
  const s = APP_SETTINGS;
  
  document.getElementById('btnShip').disabled = !(isValid && s.shipEnabled);
  document.getElementById('btnReceive').disabled = !(isValid && s.receiveEnabled);
  document.getElementById('btnWriteOff').disabled = !(isValid && s.writeOffEnabled);
}

function sendOperation(action, partNumber, quantity) {
  return new Promise((resolve) => {
    const iframeName = 'ifr_' + Date.now();
    const iframe = document.createElement('iframe'); iframe.name = iframeName; iframe.style.display = 'none';
    document.body.appendChild(iframe);
    const form = document.createElement('form'); form.method = 'POST'; form.action = API_URL; form.target = iframeName;
    
    const fields = { action, section: CURRENT_SECTION, shift: CURRENT_SHIFT, partNumber, quantity };
    for (const k in fields) {
      const input = document.createElement('input'); input.type = 'hidden'; input.name = k; input.value = fields[k];
      form.appendChild(input);
    }
    document.body.appendChild(form); form.submit();

    setTimeout(() => {
      document.body.removeChild(form); document.body.removeChild(iframe);
      resolve({ ok: true, message: '✅ Операция выполнена' });
    }, 1200);
  });
}

async function manualOperation(action) {
  const part = document.getElementById('partSelect').value;
  const qty = parseInt(document.getElementById('qtyInput').value);
  
  if (!part || !qty || qty < 1) { showStatus('error', '❌ Выберите парт-номер и введите количество'); return; }
  
  showStatus('info', '⏳ Отправка...');
  const res = await sendOperation(action, part, qty);
  
  document.getElementById('qtyInput').value = ''; 
  validateQty();
  await loadParts(true);
  showStatus('success', res.message);
}

async function generateReport() {
  const btn = document.getElementById('reportBtn');
  const dateVal = document.getElementById('reportDate').value;
  
  if (!dateVal) { showStatus('error', '❌ Выберите дату отчета'); return; }
  
  btn.disabled = true;
  btn.textContent = '⏳ Формирование...';
  showStatus('info', 'Готовим PDF-отчет, это займет пару секунд...');

  try {
    const formData = new FormData();
    formData.append('action', 'generateReport');
    formData.append('section', CURRENT_SECTION);
    formData.append('shift', CURRENT_SHIFT);
    formData.append('reportDate', dateVal);

    const res = await fetch(API_URL, { method: 'POST', body: formData });
    const data = await res.json();
    
    if (data.success) {
      showStatus('success', '✅ ' + data.message);
      if (data.pdfUrl) {
        // Создаем невидимую ссылку для скачивания
        const a = document.createElement('a');
        a.href = data.pdfUrl;
        a.download = `Отчет_${CURRENT_SECTION}_${CURRENT_SHIFT}_${dateVal}.pdf`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }
    } else {
      showStatus('error', '❌ ' + data.error);
    }
  } catch (err) {
    showStatus('error', '❌ Ошибка при создании отчета: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '📊 Сформировать PDF-отчет';
  }
}

// Код сканера (без изменений)
async function startCamera() {
  const video = document.getElementById('video');
  const container = document.getElementById('camera-container');
  const scannerBox = document.getElementById('scannerBox');
  try {
    videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = videoStream;
    await video.play();
    
    container.style.display = 'block';
    scannerBox.style.display = 'none';
    document.getElementById('stopBtn').classList.remove('hidden');
    document.getElementById('scanBtn').classList.add('hidden');
    
    if (scanInterval) clearInterval(scanInterval);
    scanInterval = setInterval(() => scanQR(video), 500);
    showStatus('info', '📷 Наведите на QR-код...');
  } catch (err) {
    showStatus('error', 'Камера недоступна: ' + err.message);
  }
}

function scanQR(video) {
  if (!video.videoWidth) return;
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0);
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const code = jsQR(imageData.data, imageData.width, imageData.height);
  
  if (code && code.data) {
    scannedData = code.data;
    document.getElementById('qrResult').value = code.data;
    document.getElementById('resultBox').style.display = 'block';
    stopCamera();
    showStatus('success', '✅ QR-код распознан!');
  }
}

function stopCamera() {
  if (scanInterval) clearInterval(scanInterval);
  if (videoStream) videoStream.getTracks().forEach(t => t.stop());
  document.getElementById('video').srcObject = null;
  document.getElementById('camera-container').style.display = 'none';
  document.getElementById('scannerBox').style.display = 'flex';
  document.getElementById('scanBtn').classList.remove('hidden');
  document.getElementById('stopBtn').classList.add('hidden');
}

async function confirmQrShipment() {
  if (!scannedData) { showStatus('error', '❌ Нет данных'); return; }
  const parts = scannedData.split('|');
  if (parts.length < 1) { showStatus('error', 'Неверный формат QR'); return; }
  const partNumber = parts[0];
  
  showStatus('info', '⏳ Отправка...');
  const res = await sendOperation('ship', partNumber, 1);
  
  await loadParts(true);
  showStatus('success', res.message);
  
  scannedData = null;
  document.getElementById('resultBox').style.display = 'none';
}

function showStatus(type, msg) {
  const el = document.getElementById('status');
  el.className = 'status-' + type; el.style.display = 'block'; el.innerHTML = msg;
}

document.addEventListener('DOMContentLoaded', () => {
  bootstrap();
  document.getElementById('qtyInput').addEventListener('input', validateQty);
  document.getElementById('qtyInput').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (!document.getElementById('btnShip').disabled) manualOperation('ship');
      else if (!document.getElementById('btnReceive').disabled) manualOperation('receive');
      else if (!document.getElementById('btnWriteOff').disabled) manualOperation('writeOff');
    }
  });
});
</script>
</body>
</html>
